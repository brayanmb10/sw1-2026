<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Pokémon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #f8f8f8;
            color: #2b2b2b;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
            padding: 24px;
            width: min(480px, 100%);
            text-align: center;
        }

        h1 {
            margin-bottom: 16px;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 18px;
        }

        input {
            flex: 1 1 180px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #ffcb05;
            color: #2b2b2b;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover:not(:disabled) {
            background: #ffdb4d;
        }

        button:disabled {
            background: #ddd;
            cursor: default;
        }

        .pokemon-data {
            display: grid;
            gap: 12px;
            justify-items: center;
        }

        #imagem-pokemon {
            width: 240px;
            height: 240px;
            object-fit: contain;
            background: #fcf4f4;
            border-radius: 20px;
        }

        .info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }

        .info span {
            background: #eef2ff;
            padding: 8px 12px;
            border-radius: 999px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Consulta de Pokémon</h1>

        <div class="controls">
            <input id="input-pokemon" placeholder="Digite nome ou número" autocomplete="off">
            <button id="btn-search">Buscar</button>
        </div>

        <div class="pokemon-data">
            <img src="" alt="Imagem do Pokémon" id="imagem-pokemon">
            <div class="info">
                <span id="pokemon-name">Nome: -</span>
                <span id="pokemon-type">Tipo: -</span>
            </div>
            <button id="btn-shiny" disabled>Mostrar Versão Shiny</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
