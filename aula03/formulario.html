<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
  <script src="scriptfm.js"></script>
</head>

<body>
    <main>
        <section id="formulario">
            <div>
                <h1>Formulário:</h1>
                <form action="https://formsubmit.co/brayanmendesbarros@gmail.com" method="post" class="formulario">

                    <div class="grupo-form">
                        <label for="username">Nome:</label>
                        <input type="text" id="username" required name="name">
                    </div>
                    <div class="grupo-form">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required name="name">
                    </div>
                    <div class="grupo-form">

                        <label for="cpf">CPF:</label>
                        <input type="number" id="cpf" required name="name">
                    </div>
                    <div class="grupo-form">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" required name="name">
                    </div>
                    <button type="submit" class="btn">Enviar</button>
        </section>
    </main>
</body>
</html>
