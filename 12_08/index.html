<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC e Validador de CPF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="grid">
            <section class="card">
                <h2>Calculadora de IMC</h2>
                <form action="imc.php" method="POST">
                    <div class="campo">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" name="peso" step="0.1" min="1" placeholder="Ex: 70" required>
                    </div>
                    <div class="campo">
                        <label for="altura">Altura (m)</label>
                        <input type="number" id="altura" name="altura" step="0.01" min="0.50" max="2.50" placeholder="Ex: 1.75" required>
                    </div>
                    <button type="submit">Calcular IMC</button>
                </form>
            </section>

            <section class="card">
                <h2>Validador de CPF</h2>
                <form action="validador.php" method="POST">
                    <div class="campo">
                        <label for="Nome">Nome</label>
                        <input type="text" id="Nome" name="Nome" placeholder="Seu nome" required>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <button type="submit">Validar CPF</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
